<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found – Chungas World</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎢</text></svg>">
<style>
:root{--night:#0d1320;--lamp:#f2b84b;--track:#e9eef2;--rail:#9a92d6;--mute:#a9b4c2}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(ellipse at 80% 0,#1b2a4a 0,var(--night) 60%);color:var(--track);font:1.0625rem/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:34rem}
.code{font:700 clamp(5rem,22vw,9rem)/1 "Trebuchet MS","Segoe UI",system-ui,sans-serif;letter-spacing:-.04em;color:var(--rail);margin:0}
h1{font:700 clamp(1.6rem,5vw,2.2rem)/1.2 "Trebuchet MS","Segoe UI",system-ui,sans-serif;letter-spacing:-.02em;margin:.5rem 0 1rem}
p{color:var(--mute);margin:0 0 1.75rem}
.btns{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-block;padding:.8rem 1.4rem;border-radius:.4rem;font-weight:700;text-decoration:none;border:2px solid var(--lamp)}
.btn.main{background:var(--lamp);color:#1a1405}
.btn.alt{color:var(--lamp)}
.btn:hover{background:var(--track);border-color:var(--track);color:#1a1405}
.btn:focus-visible{outline:3px solid var(--track);outline-offset:3px}
.rail{height:4px;width:100%;margin:0 0 2rem;background:repeating-linear-gradient(90deg,var(--rail) 0 28px,transparent 28px 40px);border-radius:2px;opacity:.7}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <div class="rail" aria-hidden="true"></div>
  <h1>This track is closed</h1>
  <p>We couldn’t find the page you were looking for. It may have moved, or the link may be wrong.</p>
  <div class="btns">
    <a class="btn main" href="/">Back to the station</a>
    <a class="btn alt" href="https://discord.chungasworld.co.uk">Ask on Discord</a>
  </div>
</main>
</body>
</html>
